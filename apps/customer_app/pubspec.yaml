name: project_phoenix_customer
description: Enterprise Field Service Management Platform - Customer Mobile Application
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^12.1.3

  # Local Database & Sync
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Network & Cache
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  geolocator: ^12.0.0

  # Security & Storage
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3

  # Voice notes recording & playback
  record: ^5.1.2

  # Utility & Date formatting
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.6

  shared_theme:
    path: ../../packages/shared_theme
  shared_api:
    path: ../../packages/shared_api
  shared_models:
    path: ../../packages/shared_models

  # Google Authentication
  google_sign_in: ^6.2.1
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Add assets configuration for icons, images, and translations
  assets:
    - assets/images/
    - assets/banners/

dependency_overrides:
  record_platform_interface: 1.2.0
